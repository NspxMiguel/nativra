name: build-uwp

# Builds the Kiosk UWP package for Xbox. No Windows machine needed locally:
# the hosted runner carries the Universal Windows Platform workload.

on:
  push:
    paths:
      - "uwp/**"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Create signing certificate
        shell: pwsh
        run: |
          # Sideloaded packages only need a self-signed certificate, and the
          # subject must match the Publisher in Package.appxmanifest exactly.
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=NSPX" `
            -KeyUsage DigitalSignature `
            -FriendlyName "NSPX Kiosk" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "kiosk" -Force -AsPlainText
          Export-PfxCertificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "uwp/Kiosk/Kiosk_TemporaryKey.pfx" `
            -Password $password | Out-Null
          Export-Certificate `
            -Cert "Cert:\CurrentUser\My\$($cert.Thumbprint)" `
            -FilePath "uwp/Kiosk.cer" | Out-Null
          Write-Host "certificate thumbprint: $($cert.Thumbprint)"

      - name: Restore
        run: msbuild uwp\Kiosk.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build package
        run: >
          msbuild uwp\Kiosk.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=Kiosk_TemporaryKey.pfx
          /p:PackageCertificatePassword=kiosk
          /p:UseDotNetNativeToolchain=false
          /p:AppxPackageDir=${{ github.workspace }}\out\
          /verbosity:minimal

      - name: Show output
        shell: pwsh
        if: always()
        run: |
          if (Test-Path out) {
            Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "no out/ directory produced"
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-uwp
          path: |
            out/**/*.msixbundle
            out/**/*.appxbundle
            out/**/*.msix
            out/**/*.appx
            uwp/Kiosk.cer
          if-no-files-found: error
