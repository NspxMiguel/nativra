; Snes9x factory config — written by emulators.ts, see src/emulators.ts.
; Section/key names below are confirmed against win32/wconfig.cpp in
; Snes9x's own source (the AddXxxC(...) calls there are literally what
; builds this file's [Section] and Key= names).
;
; No [Controls\Win] Joypad1:* lines here on purpose: those store a packed
; Windows VKey/DirectInput code, not a readable device string, and the
; exact bit layout for a joystick button (as opposed to a keyboard key)
; was not confirmed from source — Snes9x's own default gamepad
; auto-detection handles a standard Xbox/XInput pad correctly without one.

[Config]
niceAlignment=true
comments=true

[Display\Win]
OutputMethod=1
Stretch:Enabled=true
Stretch:MaintainAspectRatio=true
Stretch:IntegerScaling=false
Stretch:BilinearFilter=true
Fullscreen:Enabled=true
Fullscreen:FullscreenOnOpen=true
Fullscreen:EmulateFullscreen=true
Vsync=true
ReduceInputLag=true

[Settings]
FrameSkip=200

[Settings\Win]
PauseWhenInactive=false
ConfirmSaveLoad=false

[Settings\Win\Files]
Dir:Savestates=E:\States\snes
Dir:SRAM=E:\Saves\snes
Dir:Screenshots=E:\Saves\snes\screenshots
Dir:Cheats=E:\Saves\snes\cheats
Dir:Patches=E:\Saves\snes\patches
Dir:Bios=E:\BIOS\snes

[Sound\Win]
SoundDriver=4
BufferSize=64
