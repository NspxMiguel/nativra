; mGBA factory config — written by emulators.ts, see src/emulators.ts.
; savegamePath/savestatePath/screenshotPath/patchPath are confirmed against
; src/core/directories.c and src/core/config.c in mGBA's own source; they
; are core-level options (shared with every mGBA port, not Qt-specific),
; which is why they sit at the top of the file with no [section] header.
;
; No gamepad remap here: mGBA's own default binds a connected SDL/XInput
; pad sensibly for the Game Boy family's small button set on its own.

savegamePath=E:\Saves\gb-gbc-gba
savestatePath=E:\States\gb-gbc-gba
screenshotPath=E:\Saves\gb-gbc-gba\screenshots
patchPath=E:\Saves\gb-gbc-gba\patches

[ports.qt]
fullscreen=1
lockAspectRatio=1
lockIntegerScaling=0
interframeBlending=0
frameskip=0
mute=0
volume=256
