# RetroArch on Xbox Series X|S — points every path at the external NTFS drive,
# which the console exposes as E:. Written by xbdev; edit configs/retroarch.cfg
# in the repo, not this copy on the console.

# --- where things live (external drive) ---
rgui_browser_directory = "E:\Games"
system_directory = "E:\BIOS"
savefile_directory = "E:\Saves"
savestate_directory = "E:\States"
screenshot_directory = "E:\Screenshots"
playlist_directory = "E:\Playlists"
thumbnails_directory = "E:\Thumbnails"
content_history_dir = "E:\History"

# --- look: the console-style menu, box art on ---
menu_driver = "ozone"
ozone_menu_color_theme = "4"
menu_show_load_content_animation = "true"
menu_thumbnails = "3"
menu_left_thumbnails = "2"
menu_xmb_vertical_thumbnails = "false"
menu_show_advanced_settings = "false"
menu_widget_scale_auto = "true"
quick_menu_show_take_screenshot = "true"

# --- video: D3D11 is what UWP gets on this console ---
video_driver = "d3d11"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "false"
aspect_ratio_index = "21"
video_gpu_screenshot = "true"

# --- audio ---
audio_driver = "xaudio"
audio_latency = "64"

# --- input: the Xbox pad, and a menu that opens with the guide button ---
input_driver = "xinput"
input_joypad_driver = "xinput"
input_menu_toggle_gamepad_combo = "2"
input_auto_game_focus = "1"
quit_press_twice = "true"

# --- saves: never lose progress on a console that can be switched off ---
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "true"
autosave_interval = "60"

# --- housekeeping ---
log_verbosity = "false"
rgui_show_start_screen = "false"
pause_nonactive = "true"
