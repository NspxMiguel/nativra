; Dolphin Wii Remote factory config — written by emulators.ts.
; Source = 1 selects "Emulated Wiimote", so Wii games are playable on the
; Xbox pad with no real Wii Remote/sensor bar involved. Nunchuk extension
; is bound too, since most Wii titles that need a Wiimote also want one.

[Wiimote1]
Source = 1
Device = XInput/0/Gamepad
Buttons/A = `Button A`
Buttons/B = `Trigger L`
Buttons/1 = `Button X`
Buttons/2 = `Button Y`
Buttons/- = `Back`
Buttons/+ = `Start`
Buttons/Home = `Guide`
D-Pad/Up = `Pad N`
D-Pad/Down = `Pad S`
D-Pad/Left = `Pad W`
D-Pad/Right = `Pad E`
Extension = Nunchuk
Extension/Nunchuk/Buttons/C = `Shoulder L`
Extension/Nunchuk/Buttons/Z = `Shoulder R`
Extension/Nunchuk/Stick/Up = `Left Y+`
Extension/Nunchuk/Stick/Down = `Left Y-`
Extension/Nunchuk/Stick/Left = `Left X-`
Extension/Nunchuk/Stick/Right = `Left X+`
