# RetroArch factory config for the Win32-bridge shelf — written by
# emulators.ts, see src/emulators.ts. This is a SEPARATE RetroArch install
# from the native UWP one catalog.json/configs/retroarch.cfg already
# configures: that one is a signed appx installed through the Device
# Portal; this one is the plain portable Windows build used by the
# genesis and saturn entries here. Same console, same external drive, so
# the same E:\ layout — deliberately mirrored from the existing
# configs/retroarch.cfg rather than reinvented.

# --- where things live (external drive, shared with every emulator here) ---
rgui_browser_directory = "E:\Games"
system_directory = "E:\BIOS"
savefile_directory = "E:\Saves"
savestate_directory = "E:\States"
screenshot_directory = "E:\Screenshots"
playlist_directory = "E:\Playlists"
thumbnails_directory = "E:\Thumbnails"
content_history_dir = "E:\History"

# --- look ---
menu_driver = "ozone"
menu_show_load_content_animation = "true"
menu_thumbnails = "3"
menu_show_advanced_settings = "false"

# --- video ---
video_driver = "d3d11"
video_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
video_scale_integer = "false"
video_gpu_screenshot = "true"

# --- audio ---
audio_driver = "xaudio"
audio_latency = "64"

# --- input: the Xbox pad ---
input_driver = "xinput"
input_joypad_driver = "xinput"
input_menu_toggle_gamepad_combo = "2"
input_auto_game_focus = "1"
quit_press_twice = "true"

# --- saves ---
savestate_auto_save = "true"
savestate_auto_load = "true"
autosave_interval = "60"

# --- housekeeping ---
log_verbosity = "false"
rgui_show_start_screen = "false"
pause_nonactive = "true"
