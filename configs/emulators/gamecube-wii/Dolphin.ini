; Dolphin factory config — written by emulators.ts, see src/emulators.ts.
; Manual install: see the note on the gamecube-wii entry in src/emulators.ts
; — Dolphin's own download site blocks scripted fetches, so this file is
; dropped into an already-extracted Dolphin folder rather than one this
; module downloaded itself.

[General]
ISOPath0 = E:\Games\gamecube-wii
ISOPaths = 1
RecursiveISOPaths = True
NANDRootPath = E:\Saves\gamecube-wii\Wii

[Interface]
ConfirmStop = False
UsePanicHandlers = False
OnScreenDisplayMessages = True
ShowActiveTitle = True

[Core]
; Cross-reference only — GameCube IPL / Wii NAND are optional here; see
; docs/EMULATORS.md and the console's own BIOS table.
SkipIPL = True
CPUCore = 1
Fastmem = True
GFXBackend = D3D12
AudioBackend = XAudio2
EnableCheats = False
; SIDevice0 = 6 (SIDEVICE_GC_CONTROLLER) and SlotA = 8 (EXIDeviceType::MemoryCardFolder)
; — confirmed against Source/Core/Core/HW/SI/SI_Device.h and EXI_Device.h.
SIDevice0 = 6
SlotA = 8
GCIFolderAPath = E:\Saves\gamecube-wii\GC\Card A

[DSP]
EnableJIT = True
