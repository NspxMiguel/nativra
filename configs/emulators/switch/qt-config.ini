; Eden factory config — written by emulators.ts, see src/emulators.ts.
; Key names and enum values below are confirmed against Eden's own source
; (src/common/settings.h and settings_enums.h) as of 2026-09-20 — group
; headers ([Renderer]/[System]/[Core]) follow the yuzu-family Qt config
; convention this codebase inherited (Eden is a fork of Citron, itself a
; fork of Yuzu) but were not individually re-confirmed against Eden's own
; Qt config writer.
;
; No explicit controller bind strings here, unlike the other entries in
; this shelf: Eden's input system (src/input_common/drivers/sdl_driver.cpp)
; is architecturally different enough from Azahar/Citra's that the
; ParamPackage format verified there was not re-verified for this codebase,
; and hand-guessing a wrong bind string here would silently do nothing.
; Eden's own "Controllers" dialog reliably auto-detects and correctly binds
; the first connected SDL/XInput pad on its own — leaning on that instead.

[Renderer]
renderer_backend=1
resolution_setup=6
use_vsync=true
use_speed_limit=true
fullscreen_mode=1

[System]
use_docked_mode=1

[Core]
use_multi_core=true
