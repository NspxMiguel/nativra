; PPSSPP factory config — written by emulators.ts, see src/emulators.ts.
;
; This file lives inside PPSSPP's own portable "memstick" folder (created by
; emulators.ts's extraDirs, per PPSSPP's own portable-mode convention: an
; empty "memstick" folder next to the exe, and no "installed.txt", makes it
; use that folder instead of Documents\PPSSPP). Because the whole app folder
; is installed on the console's external drive, this already satisfies "one
; shared, persistent save location" without needing a further redirect —
; unlike DuckStation/PCSX2, PPSSPP does not expose a confirmed ini key to
; relocate the memstick root from inside ppsspp.ini itself (the memstick
; folder is what decides portable mode in the first place).

[General]
FirstRun = False
FastForwardMode = 0
AutoLoadSaveState = 0
EnableCheats = False
UISound = False
GameListView = True
CheckForNewVersion = False
StatusBarShow = False
ShowFPSCounter = 0

[CPU]
CPUCore = 1
SeparateCPUThread = True
SeparateIOThread = True
IOTimingMethod = 1
FastMemoryAccess = True

[Graphics]
GraphicsBackend = Direct3D11
RenderingMode = 1
SoftwareRendering = False
HardwareTransform = True
FullScreen = True
FullScreenMulti = False
InternalResolution = 4
AnisotropyLevel = 4
VSyncInterval = True
TextureFiltering = 3
TextureScalingLevel = 3
TextureScalingType = 0
FrameSkip = 0
AutoFrameSkip = False
ForceMaxEmulatedFPS = 60
DisplayFramerate = 60

[Sound]
Enable = True
Volume = 7
Backend = 0

[Control]
HapticFeedback = False
ShowTouchControls = False
GamepadOnlyFocused = False
