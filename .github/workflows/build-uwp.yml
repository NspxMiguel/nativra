name: Build Nativra for Xbox

# Builds the Kiosk UWP package for Xbox. No Windows machine needed locally:
# the hosted runner carries the Universal Windows Platform workload.

on:
  push:
    paths:
      - "uwp/**"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.KIOSK_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.KIOSK_PFX_PASSWORD }}
        run: |
          # One certificate for every build. Signing each release with a fresh
          # one looks fine until you try to update an installed package: the
          # console refuses it with a bare access-denied, because the identity
          # no longer matches what it already has.
          if (-not $env:PFX_BASE64) {
            Write-Error "KIOSK_PFX_BASE64 is not set — see README"
            exit 1
          }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes("uwp/Kiosk/Kiosk_TemporaryKey.pfx", $bytes)
          # Same certificate for every project in the solution, so both packages
          # carry one identity.
          [IO.File]::WriteAllBytes("uwp/JitProbe/JitProbe_TemporaryKey.pfx", $bytes)
          $password = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate `
            -FilePath "uwp/Kiosk/Kiosk_TemporaryKey.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password
          Export-Certificate -Cert $imported -FilePath "uwp/Kiosk.cer" | Out-Null
          Write-Host "signing as $($imported.Subject), thumbprint $($imported.Thumbprint)"

      - name: Build native TLS carriers
        shell: cmd
        run: uwp\TlsCarrier\build.cmd

      # The console has no HLSL compiler, and games that reflect or compile
      # shaders at run time (Hades) call it. The Windows SDK ships
      # d3dcompiler_47.dll as redistributable code for exactly this: carried
      # in the package, LoadPackagedLibrary finds it by name.
      - name: Take the redistributable shader compiler from the Windows SDK
        shell: pwsh
        run: |
          $found = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Redist" -Recurse -Filter d3dcompiler_47.dll |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $found) { throw "d3dcompiler_47.dll not found in the Windows SDK redist folder" }
          New-Item -ItemType Directory -Force uwp\Redist | Out-Null
          Copy-Item $found.FullName uwp\Redist\d3dcompiler_47.dll
          Write-Host "carrying $($found.FullName) ($($found.Length) bytes)"

      - name: Restore
        run: msbuild uwp\Kiosk.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Compile spatial upscaling shaders
        shell: cmd
        run: uwp\Kiosk\Shaders\build.cmd

      # Every build carries a higher version, so the console installs it as an
      # update of the one already there. An update keeps the app's storage —
      # downloaded games and the Steam sign-in — where a same-version package
      # has to be uninstalled first and takes both with it.
      - name: Stamp package version
        shell: pwsh
        run: |
          $path = Resolve-Path "uwp/Kiosk/Package.appxmanifest"
          $xml = [xml](Get-Content $path)
          $xml.Package.Identity.Version = "1.0.$env:GITHUB_RUN_NUMBER.0"
          $xml.Save($path)
          Write-Host "version 1.0.$env:GITHUB_RUN_NUMBER.0"

      - name: Build package
        run: >
          msbuild uwp\Kiosk.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificatePassword=${{ secrets.KIOSK_PFX_PASSWORD }}
          /p:AppxPackageDir=${{ github.workspace }}\out\
          /verbosity:minimal

      - name: Show output
        shell: pwsh
        if: always()
        run: |
          if (Test-Path out) {
            Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "no out/ directory produced"
          }

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item uwp/Kiosk.cer out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath kiosk-uwp.zip -Force
          # The app updates itself from this one file: the bundle alone is a
          # few MB, and its dependencies are already on any console running it.
          $bundle = Get-ChildItem out -Recurse -Filter 'Kiosk_*_x64.msixbundle' | Select-Object -First 1
          if ($bundle) { Copy-Item $bundle.FullName nativra-x64.msixbundle }
          Get-Item kiosk-uwp.zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload package
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kiosk-uwp
          path: kiosk-uwp.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="kiosk-build-${GITHUB_RUN_NUMBER}"
          assets=(kiosk-uwp.zip)
          [ -f nativra-x64.msixbundle ] && assets+=(nativra-x64.msixbundle)
          gh release create "$tag" "${assets[@]}" \
            --title "Nativra pre-alpha · development build ${GITHUB_RUN_NUMBER}" \
            --prerelease --latest=false \
            --notes "Experimental automated build for Xbox Dev Mode. Not a stable release or a compatibility guarantee. Read README.md and docs/progress before installing. Back up app data before uninstalling. Install with: bun src/xbdev.ts install <files>" \
            --repo "$GITHUB_REPOSITORY"
