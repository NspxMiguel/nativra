; PCSX2 factory config — written by emulators.ts, see src/emulators.ts.
; PCSX2's Qt build shares its input-binding and folder-settings code with
; DuckStation (same maintainer, same "common" library), so the shape of
; this file mirrors configs/emulators/ps1/settings.ini on purpose.

[UI]
SettingsVersion = 1
InhibitScreenSaver = true
ConfirmShutdown = false
StartFullscreen = true
PauseOnFocusLoss = false
SaveStateOnShutdown = true

[EmuCore]
EnableFastBoot = true
EnableCheats = true

[EmuCore/GS]
Renderer = 12
VsyncEnable = 1
UpscaleMultiplier = 4.000000
Fullscreen = true

[Folders]
; Cross-reference only — the PS2 BIOS itself belongs to the console's own
; BIOS table (docs/EMULATORS.md just says whether one is needed).
Bios = E:\BIOS\ps2
Snapshots = E:\Saves\ps2\snapshots
Savestates = E:\States\ps2
MemoryCards = E:\Saves\ps2\memcards
Cheats = E:\Saves\ps2\cheats
Textures = E:\Saves\ps2\textures
InputProfiles = E:\Saves\ps2\inputprofiles

[Filenames]
BIOS =

; --- controller: same SDL binding syntax PCSX2 inherited from DuckStation's
; input source code — an Xbox pad shows up as SDL-0 through the bundled
; gamecontrollerdb.txt regardless of which of the two backends is active. ---
[Pad1]
Type = DualShock2
Up = SDL-0/DPadUp
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Right = SDL-0/DPadRight
Select = SDL-0/Back
Start = SDL-0/Start
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
SmallMotor = SDL-0/SmallMotor
LargeMotor = SDL-0/LargeMotor

[Hotkeys]
ToggleFullscreen = SDL-0/Guide
