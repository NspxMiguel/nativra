; DuckStation factory config — written by emulators.ts, see src/emulators.ts.
; Edit this file in the repo, not the copy inside an installed DuckStation folder.

[Main]
SettingsVersion = 3
StartFullscreen = true
InhibitScreensaver = true
PauseOnFocusLoss = false
PauseOnControllerDisconnection = true
ConfirmPowerOff = false
SaveStateOnExit = true
LoadDevicesFromSaveStates = false
ApplyGameSettings = true
AutoLoadCheats = true

[Console]
Region = Auto

[CPU]
ExecutionMode = Recompiler
FastmemMode = MMap

[GPU]
Renderer = Automatic
ResolutionScale = 4
Multisamples = 1
UseThread = true
TrueColor = true
ScaledDithering = true
TextureFilter = xBR
PGXPEnable = true
PGXPCulling = true
PGXPTextureCorrection = true
WidescreenHack = false

[Display]
Fullscreen = true
ExclusiveFullscreenControl = Automatic
CropMode = Overscan
AspectRatio = Auto
Scaling = BilinearSmooth
VSync = true

[BIOS]
; Cross-reference only — see docs/EMULATORS.md and the console's own BIOS
; table. This directory is where a dumped PS1 BIOS goes; DuckStation runs a
; fast HLE boot when it is empty, but a real BIOS matches a real console.
SearchDirectory = E:\BIOS\ps1

[Folders]
Cache = E:\BIOS\ps1\cache
Covers = E:\Saves\ps1\covers
SaveStates = E:\States\ps1
GameSettings = E:\Saves\ps1\gamesettings
Cheats = E:\Saves\ps1\cheats
Patches = E:\Saves\ps1\patches
Textures = E:\Saves\ps1\textures
Videos = E:\Saves\ps1\videos

[MemoryCards]
Card1Type = PerGame
Card2Type = None
Directory = E:\Saves\ps1
UsePlaylistTitle = true

; --- controller: DuckStation ships its own SDL controller DB
; (resources/gamecontrollerdb.txt), which is what maps a real Xbox
; controller's XInput report onto these SDL binding names. ---
[Pad1]
Type = AnalogController
Up = SDL-0/DPadUp
Down = SDL-0/DPadDown
Left = SDL-0/DPadLeft
Right = SDL-0/DPadRight
Select = SDL-0/Back
Start = SDL-0/Start
Triangle = SDL-0/Y
Circle = SDL-0/B
Cross = SDL-0/A
Square = SDL-0/X
L1 = SDL-0/LeftShoulder
R1 = SDL-0/RightShoulder
L2 = SDL-0/+LeftTrigger
R2 = SDL-0/+RightTrigger
L3 = SDL-0/LeftStick
R3 = SDL-0/RightStick
LLeft = SDL-0/-LeftX
LRight = SDL-0/+LeftX
LDown = SDL-0/+LeftY
LUp = SDL-0/-LeftY
RLeft = SDL-0/-RightX
RRight = SDL-0/+RightX
RDown = SDL-0/+RightY
RUp = SDL-0/-RightY
SmallMotor = SDL-0/SmallMotor
LargeMotor = SDL-0/LargeMotor

[Hotkeys]
FastForward = SDL-0/+RightTrigger
TogglePause = SDL-0/Guide
Screenshot = SDL-0/Back+SDL-0/A

[Logging]
LogLevel = Warning
LogToConsole = false
