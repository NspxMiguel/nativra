; Flycast factory config — written by emulators.ts, see src/emulators.ts.
; Every key here is confirmed against core/cfg/option.cpp/option.h in
; Flycast's own source: the section defaults to "config" unless the
; Option<> constructor names one explicitly (as "input" does below), bools
; parse "yes"/"true"/"on"/"1" case-insensitively, and a vector<string>
; path option (ContentPath, BiosPath, ...) is a single ';'-separated line.
;
; No [input] overrides: MapleMainDevices already default to a Sega
; Controller on port 1 with a VMU in both its expansion slots, which is
; the correct factory setup, and Flycast auto-maps a connected XInput pad
; through SDL on its own.

[config]
Dreamcast.Region = 1
Dreamcast.Broadcast = 0
Dreamcast.Language = 1
Dreamcast.ContentPath = E:\Games\dreamcast
Dreamcast.BiosPath = E:\BIOS\dreamcast
Dreamcast.SavestatePath = E:\States\dreamcast
Dreamcast.SavePath = E:\Saves\dreamcast
Dreamcast.VMUPath = E:\Saves\dreamcast\vmu

rend.Resolution = 1440
rend.WidescreenGameHacks = yes
rend.vsync = yes
rend.IntegerScale = no
rend.LinearInterpolation = yes
rend.AnisotropicFiltering = 4
rend.ThreadedRendering = yes
rend.PerStripSorting = yes
