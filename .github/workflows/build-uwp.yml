name: build-uwp

# Builds the Kiosk UWP package for Xbox. No Windows machine needed locally:
# the hosted runner carries the Universal Windows Platform workload.

on:
  push:
    paths:
      - "uwp/**"
      - ".github/workflows/build-uwp.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.KIOSK_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.KIOSK_PFX_PASSWORD }}
        run: |
          # One certificate for every build. Signing each release with a fresh
          # one looks fine until you try to update an installed package: the
          # console refuses it with a bare access-denied, because the identity
          # no longer matches what it already has.
          if (-not $env:PFX_BASE64) {
            Write-Error "KIOSK_PFX_BASE64 is not set — see README"
            exit 1
          }
          $bytes = [Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes("uwp/Kiosk/Kiosk_TemporaryKey.pfx", $bytes)
          # Same certificate for every project in the solution, so both packages
          # carry one identity.
          [IO.File]::WriteAllBytes("uwp/JitProbe/JitProbe_TemporaryKey.pfx", $bytes)
          $password = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate `
            -FilePath "uwp/Kiosk/Kiosk_TemporaryKey.pfx" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Password $password
          Export-Certificate -Cert $imported -FilePath "uwp/Kiosk.cer" | Out-Null
          Write-Host "signing as $($imported.Subject), thumbprint $($imported.Thumbprint)"

      - name: Build native TLS carriers
        shell: cmd
        run: uwp\TlsCarrier\build.cmd

      - name: Restore
        run: msbuild uwp\Kiosk.sln /t:Restore /p:Configuration=Release /p:Platform=x64

      - name: Build package
        run: >
          msbuild uwp\Kiosk.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificatePassword=${{ secrets.KIOSK_PFX_PASSWORD }}
          /p:AppxPackageDir=${{ github.workspace }}\out\
          /verbosity:minimal

      - name: Show output
        shell: pwsh
        if: always()
        run: |
          if (Test-Path out) {
            Get-ChildItem -Recurse out | Select-Object FullName, Length | Format-Table -AutoSize
          } else {
            Write-Host "no out/ directory produced"
          }

      - name: Pack
        shell: pwsh
        run: |
          Copy-Item uwp/Kiosk.cer out/ -ErrorAction SilentlyContinue
          Compress-Archive -Path out/* -DestinationPath kiosk-uwp.zip -Force
          Get-Item kiosk-uwp.zip | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload package
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: kiosk-uwp
          path: kiosk-uwp.zip

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="kiosk-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" kiosk-uwp.zip \
            --title "Kiosk build ${GITHUB_RUN_NUMBER}" \
            --notes "UWP package for Xbox Dev Mode. Install with: bun src/xbdev.ts install <files>" \
            --repo "$GITHUB_REPOSITORY"
