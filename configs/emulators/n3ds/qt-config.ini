; Azahar factory config — written by emulators.ts, see src/emulators.ts.
; Key names for [Renderer] were confirmed against src/citra_qt/configuration/config.cpp
; (each Settings::values.<x> reads/writes an ini key of that same name).
; [Controls] bind strings were confirmed against src/input_common/sdl/sdl_impl.cpp:
; Common::ParamPackage serializes as "key:value,key:value", and "maptype:all"
; explicitly matches any connected controller instead of one specific SDL GUID
; — the only sane default for a console where the exact controller GUID isn't
; known ahead of time. Button/axis indices are the standard SDL2-on-Windows
; XInput joystick order: A=0, B=1, X=2, Y=3, LB=4, RB=5, Back=6, Start=7,
; LeftStick=8, RightStick=9, LeftTrigger=axis 4, RightTrigger=axis 5,
; left stick=axes 0/1, right stick=axes 2/3, D-pad=hat 0.

[Renderer]
graphics_api=1
use_vsync=true
resolution_factor=3
use_integer_scaling=false
use_disk_shader_cache=true
async_shader_compilation=true
use_hw_shader=true
frame_limit=100

[Layout]
layout_option=0
swap_screen=false
upright_screen=false

[Controls]
profiles\size=1
profiles\1\name=Default
profiles\1\button_a=engine:sdl,maptype:all,button:0
profiles\1\button_b=engine:sdl,maptype:all,button:1
profiles\1\button_x=engine:sdl,maptype:all,button:2
profiles\1\button_y=engine:sdl,maptype:all,button:3
profiles\1\button_l=engine:sdl,maptype:all,button:4
profiles\1\button_r=engine:sdl,maptype:all,button:5
profiles\1\button_zl=engine:sdl,maptype:all,axis:4,direction:+
profiles\1\button_zr=engine:sdl,maptype:all,axis:5,direction:+
profiles\1\button_start=engine:sdl,maptype:all,button:7
profiles\1\button_select=engine:sdl,maptype:all,button:6
profiles\1\button_home=engine:sdl,maptype:all,button:8
profiles\1\button_up=engine:sdl,maptype:all,hat:0,direction:up
profiles\1\button_down=engine:sdl,maptype:all,hat:0,direction:down
profiles\1\button_left=engine:sdl,maptype:all,hat:0,direction:left
profiles\1\button_right=engine:sdl,maptype:all,hat:0,direction:right
profiles\1\circle_pad=engine:sdl,maptype:all,axis_x:0,axis_y:1
profiles\1\c_stick=engine:sdl,maptype:all,axis_x:2,axis_y:3
