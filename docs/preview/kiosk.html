<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Kiosk — preview</title>
<!--
  Console home screen at 1920x1080 — the grammar is Switch/PS5, not a web page:
  a thin system bar, one horizontal rail of large square icons, the focused
  item's name shown above the rail (never inside the icon), and a button-hint
  bar at the bottom. Almost no prose. Mirrored into uwp/Kiosk/*.xaml.
-->
<style>
  :root { --accent:#3BE081; --dim:rgba(255,255,255,0.55); --faint:rgba(255,255,255,0.32); }
  * { margin:0; padding:0; box-sizing:border-box; }
  /* Laid out at a true 1920x1080 and scaled to whatever window shows it, so
     the preview matches the TV frame the app actually gets. */
  html, body { width:100%; height:100%; }
  body {
    width:1920px; height:1080px; overflow:hidden; color:#fff;
    zoom: calc(100vw / 1920);
    font-family:"SF Pro Text", -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#0A0C0F;
  }
  .bg { position:absolute; inset:0;
    background:
      radial-gradient(70% 55% at 50% 42%, rgba(59,224,129,0.07) 0%, transparent 62%),
      linear-gradient(180deg, #0D1013 0%, #07090B 100%);
  }
  .frame { position:relative; height:100%; display:flex; flex-direction:column; }

  /* --- system bar: thin, quiet, always there --- */
  .sys { height:76px; padding:0 64px; display:flex; align-items:center; gap:18px; }
  .avatar { width:44px; height:44px; border-radius:999px; background:linear-gradient(135deg,#3BE081,#1E8F55); }
  .who { font-size:19px; color:var(--dim); }
  .sys .right { margin-left:auto; display:flex; align-items:center; gap:22px; color:var(--dim); font-size:18px; }
  .sys .right .clock { color:#fff; font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ico { width:22px; height:22px; border-radius:5px; background:rgba(255,255,255,0.22); }

  /* --- the rail: this is the whole screen --- */
  .stage { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .label { padding:0 64px; height:120px; display:flex; flex-direction:column; justify-content:flex-end; }
  .label .name { font-size:56px; font-weight:700; letter-spacing:-0.02em; }
  .label .sub { font-size:21px; color:var(--dim); margin-top:8px; }

  .rail { display:flex; gap:26px; padding:38px 64px 0; align-items:center; }
  .tile {
    width:172px; height:172px; border-radius:18px; flex:none;
    background:#161A1F; border:2px solid rgba(255,255,255,0.08);
    display:grid; place-items:center;
    font-size:34px; font-weight:700; color:rgba(255,255,255,0.48);
    overflow:hidden;
  }
  /* Focus: the icon grows and takes a bright ring. Nothing else on screen moves. */
  .tile.on {
    width:228px; height:228px; border-radius:22px;
    border:4px solid #fff;
    background:linear-gradient(145deg,#1E7A57,#0E4634);
    color:#fff; font-size:46px;
    box-shadow:0 0 0 10px rgba(59,224,129,0.16);
  }

  /* --- button hints --- */
  .hints { height:96px; padding:0 64px; display:flex; align-items:center; gap:36px;
           border-top:1px solid rgba(255,255,255,0.07); }
  .hint { display:flex; align-items:center; gap:11px; font-size:18px; color:var(--dim); }
  .b { width:32px; height:32px; border-radius:999px; display:grid; place-items:center;
       font-size:16px; font-weight:700; color:#06120C; }
  .b.a { background:#3BE081; } .b.x { background:#56A8F5; }
  .b.y { background:#F2C94C; } .b.m { background:rgba(255,255,255,0.22); color:#fff; font-size:14px; }
  .hints .right { margin-left:auto; font-size:17px; color:var(--faint); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame">

    <div class="sys">
      <div class="avatar"></div>
      <div class="who">KIOSK — XBOXONE-DEV</div>
      <div class="right">
        <div>E: 1,8 TB</div>
        <div class="ico"></div>
        <div class="clock">03:47</div>
      </div>
    </div>

    <div class="stage">
      <div class="label">
        <div class="name">RetroArch</div>
        <div class="sub">218 sistemas · modo jogo</div>
      </div>

      <div class="rail">
        <div class="tile on">RA</div>
        <div class="tile">XE</div>
        <div class="tile">X2</div>
        <div class="tile">DO</div>
        <div class="tile">GZ</div>
        <div class="tile">RZ</div>
        <div class="tile">SV</div>
        <div class="tile">DB</div>
        <div class="tile">FC</div>
      </div>
    </div>

    <div class="hints">
      <div class="hint"><span class="b a">A</span> Abrir</div>
      <div class="hint"><span class="b x">X</span> Detalhes</div>
      <div class="hint"><span class="b y">Y</span> Atualizar</div>
      <div class="hint"><span class="b m">≡</span> Ajustes</div>
      <div class="right">9 instalados</div>
    </div>

  </div>
</body>
</html>
